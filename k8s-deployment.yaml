apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-java-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-java
  template:
    metadata:
      labels:
        app: hello-java
    spec:
      containers:
        - name: hello-java
          image: praveen2929/hello-java-app
          args: ["Praveen"]
